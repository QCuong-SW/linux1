# Use after certificates exist. Replace domain and certificate paths.
server {
    listen 80;
    server_name miniflow.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name miniflow.example.com;
    ssl_certificate /etc/letsencrypt/live/miniflow.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/miniflow.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        # Preserve /api/ for Nest's global prefix (no trailing slash).
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
