name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Check operation scripts
        run: |
          for script in infra/scripts/*.sh; do bash -n "$script"; done
          shellcheck -x infra/scripts/*.sh
          node --test infra/test/scripts.test.mjs
  application:
    needs: configuration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: miniflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d miniflow_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/miniflow_test
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/miniflow_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test --workspace backend -- --runInBand
      - run: npm run test:e2e --workspace backend -- --runInBand
      - run: npm run test:db --workspace backend
      - run: node --test frontend/test/*.test.mjs
      - run: npm run build
      - run: docker build -f backend/Dockerfile --target migration -t miniflow-migration:ci .
      - run: docker build -f backend/Dockerfile --target runner -t miniflow-backend:ci .
      - run: docker build -f frontend/Dockerfile --target runner -t miniflow-frontend:ci .
      - name: Review production containers, backup and restore
        run: node infra/test/production-review.mjs --image-tag ci
      - name: Upload production review logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-review
          path: /tmp/miniflow-production-review/*.log
          retention-days: 7
